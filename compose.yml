name: paperlens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${RAG_DB_USER:-paperlens}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-paperlens_local_only}
      POSTGRES_DB: ${RAG_DB_NAME:-paperlens}
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-55432}:5432"
    volumes:
      - paperlens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  paperlens_postgres_data:
